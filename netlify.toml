# Fix 1: Remove `base = "frontend"` so functions directory resolves from repo root.
# With base="frontend", Netlify looked for functions at frontend/netlify/functions (wrong!).
# Now it looks at netlify/functions (correct), which fixes the DOCTYPE/JSON parse error.

[build]
  publish = "frontend/dist"
  command = "cd frontend && npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
