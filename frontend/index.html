<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2306b6d4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PhishGuard Pro — Advanced multi-factor phishing detection and URL threat intelligence system." />
    <title>PhishGuard Pro — Autonomous Phishing &amp; URL Threat Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Hide Netlify badge on free tier -->
    <style>
      #nl-badge-frame { display: none !important; visibility: hidden !important; }
    </style>
  </head>
  <body class="bg-[#070b14] text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Also hide badge injected after load -->
    <script>
      (function() {
        function hideNetlifyBadge() {
          var badge = document.getElementById('nl-badge-frame');
          if (badge) { badge.style.display = 'none'; badge.style.visibility = 'hidden'; }
        }
        hideNetlifyBadge();
        var obs = new MutationObserver(hideNetlifyBadge);
        obs.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
